name: Application PC (.exe)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Compilation du site pour l'application de bureau (chemins relatifs, sans service worker).
      - run: npx vite build --mode electron --base=./ --outDir desktop/app --emptyOutDir
      - run: npm install
        working-directory: desktop
      - run: npx electron-builder --win --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: TrackPulse-Windows
          path: desktop/release/*.exe
